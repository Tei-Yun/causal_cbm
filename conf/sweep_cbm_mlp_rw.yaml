defaults:
  - default
  #tei 주석 처리 11/29
  #- override causal_discovery: ges
  #- override llm: gpt
  #- override rag: standard
  - override causal_discovery: Null
  - override llm: Null
  - override rag: Null
  - _self_  
  # override this to use the new list sweeper:
  - override hydra/sweeper: list
 
hydra:
  mode: MULTIRUN
  sweep:
    #dir: "outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}_cbm_mlp_joint_lossw0.8_int_prob_0.8"
    dir: "outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}_cbm_mlp_indep_celeba_cnf_prob"
  
  sweeper:
    # standard grid search
    grid_params:
      # possible datsets are:
      # asia, sachs, insurance, alarm, hailfinder, cub_causal_struct, synthetic
      # colormnist, colormnist_ood, celeba, celeba_unfair, siim_pneumothorax
      # possible models are:
      # blackbox, blackbox_multi, cbm_linear, cbm_mlp, cem, c2bm

      model: cbm_mlp #이부분 linear로 바꿔보기
      seed: 1 #,2,3,4,5
      model.hidden_size: 64
      model.concept_loss_weight: 0.8
      engine.optim_kwargs.lr: 0.00075

      #tei 추가 12/3
      model.training_mode: independent  # 또는 [joint, stepwise, independent]

    list_params:
      dataset: celeba  #, cub_causal_struct, siim_pneumothorax
      dataset.batch_size: 512   #, 512, 128

#tei 수정 11/29
#policy: nodes_true # levels_true, levels_pred, nodes_true, nodes_pred, random

#tei 수정 12/11 w/yeom
policy: cnf_prob_cf #none, levels_true, levels_pred, nodes_true, nodes_pred, random , cnf_cf, cnf_prob_cf
cnf_bundle_path: '/home/taehui/causally-reliable-cbm/CNF_notebooks/cnf_bundle_celeba.pt'

#test_only: false # false
test_only: true
ckpt_path: '/home/taehui/causally-reliable-cbm/outputs/multirun/2025-12-23/12-36-47_cbm_mlp_indep_celeba/0/checkpoints/epoch=7-step=2544.ckpt'


dataset:
  #load_embeddings: false
  load_embeddings: true
  load_graph: true        # <--- 여기를 true로 변경 (저장된 graph.pkl 로드)
  load_true_graph: false  # <--- 여기는 false 유지 (코드 상의 True Graph 사용 안 함)
  batch_size: 512  # 128 (Pneumo, all SCBM), 512 (all others)
  num_workers: 4 #0


engine:
  intervention_prob: 0 #0, 0.25,  0.8
 

trainer:
  logger: null  # wandb, null
  devices: [5]
  max_epochs: 500 #500
  patience: 30


