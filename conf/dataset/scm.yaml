defaults:
  - commons
  - _self_

name: scm

loader:
  _target_: src.data.datasets.synthetic.get_synthetic_datasets
  type: Structural-Noise SCM #scm,Structural-Noise SCM
  num_vars: 10
  num_points: 10000
  num_predicates: 4
  train_ratio: 0.7
  val_ratio: 0.1
  ftune_size: 0.0
  seed: ${seed}

is_image_dataset: false
reduce_fraction: null
onehot_to_concepts: false

label_descriptions:
  c0_root: Root concept (C0)
  c1_chain: Chain concept (C1 <- C0)
  c2_fork: Fork concept (C2 <- C0)
  c3_collider: Collider concept (C3 <- C1, C2)
  y: Target task (Y <- C3)
